<header class="header">
  <div class="header-left">

    <!-- ─── Dropdown custom de veículo ─── -->
    <div class="vehicle-picker"
         [class.is-fault]="veiculoSelecionadoTemFalha()"
         [class.is-open]="dropdownAberto()">

      <button class="picker-trigger" (click)="toggleDropdown()">
        <span class="picker-dot"></span>

        <div class="picker-text">
          <span class="picker-caption">Veículo</span>
          <span class="picker-value">{{ labelSelecionado() }}</span>
        </div>

        <svg class="picker-chevron" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      @if (dropdownAberto()) {
        <ul class="picker-menu" (click)="$event.stopPropagation()">
          @for (v of veiculos(); track v.id) {
            <li class="picker-option"
                [class.is-selected]="v.id === state.veiculoSelecionado()"
                [class.is-fault]="v.tipo_falha !== 'normal'"
                (click)="selecionar(v.id)">
              <span class="opt-dot"></span>
              <span class="opt-label">{{ labelVeiculo(v) }}</span>
              @if (v.id === state.veiculoSelecionado()) {
                <svg class="opt-check" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 13l4 4L19 7"/>
                </svg>
              }
            </li>
          }
        </ul>
      }
    </div>

    <div class="fleet-status">
      <span class="dot ok"></span>
      {{ fleetOnline() }} de {{ fleetTotal() }} veículos operando normalmente
    </div>

    <div class="sim-controls">
      <button class="btn-sim" (click)="onSimular()" [disabled]="state.simulacaoAtiva()">
        ▶ Simular
      </button>
      <button class="btn-stop" (click)="onParar()" [disabled]="!state.simulacaoAtiva()">
        ■ Parar
      </button>
    </div>
  </div>

  <div class="header-right">
    <div class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      @if (alertCount() > 0) { <span class="badge">{{ alertCount() }}</span> }
    </div>
    <div class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 2.5h3.4l.5 2.4a7.4 7.4 0 0 1 2 1.15l2.3-.85 1.7 3-1.85 1.6a7.7 7.7 0 0 1 0 2.4l1.85 1.6-1.7 3-2.3-.85a7.4 7.4 0 0 1-2 1.15l-.5 2.4h-3.4l-.5-2.4a7.4 7.4 0 0 1-2-1.15l-2.3.85-1.7-3 1.85-1.6a7.7 7.7 0 0 1 0-2.4L3.8 8.24l1.7-3 2.3.85a7.4 7.4 0 0 1 2-1.15Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
  </div>
</header>
