<header class="header">
  <div class="header-left">
    <div class="vehicle-select">
      <div>
        <div class="id">{{ vehicleId }}</div>
        <div class="plate">{{ vehiclePlate }}</div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="fleet-status">
      <span class="dot ok"></span>
      {{ fleetOnline }} de {{ fleetTotal }} veículos operando normalmente
    </div>
  </div>
  <div class="header-right">
    <div class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" *ngIf="alertCount > 0">{{ alertCount }}</span>
    </div>
    <div class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 2.5h3.4l.5 2.4a7.4 7.4 0 0 1 2 1.15l2.3-.85 1.7 3-1.85 1.6a7.7 7.7 0 0 1 0 2.4l1.85 1.6-1.7 3-2.3-.85a7.4 7.4 0 0 1-2 1.15l-.5 2.4h-3.4l-.5-2.4a7.4 7.4 0 0 1-2-1.15l-2.3.85-1.7-3 1.85-1.6a7.7 7.7 0 0 1 0-2.4L3.8 8.24l1.7-3 2.3.85a7.4 7.4 0 0 1 2-1.15Z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>
</header>
