<div class="sensor-card" [ngClass]="'status-' + status">
  <div class="sensor-head">
    <span class="sensor-name">{{ name }}</span>
    <span class="sensor-unit-tag">{{ unit }}</span>
  </div>

  <div class="sensor-reading">
    <span class="sensor-value">{{ value }}</span>
    <span class="sensor-value-unit">{{ unit }}</span>
  </div>

  <div class="sensor-status-line">
    <span *ngIf="status !== 'ok'">⚠ </span>{{ statusText }}
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" viewBox="0 0 280 64" preserveAspectRatio="none">
      <polygon *ngIf="areaPoints" [attr.points]="areaPoints" class="chart-area"></polygon>
      <polyline *ngIf="linePoints" [attr.points]="linePoints" class="chart-line"></polyline>
      <circle *ngIf="lastPoint" [attr.cx]="lastPoint.x" [attr.cy]="lastPoint.y" r="3" class="chart-dot"></circle>
    </svg>
    <div class="chart-empty" *ngIf="!linePoints">sem histórico suficiente</div>
  </div>
</div>
